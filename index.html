<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Life Game</h1>

    <div class="controls">

        <div>
            <label for="width">横のマス数：</label>
            <input type="number" id="width" value="30" min="1">
        </div>

        <div>
            <label for="height">縦のマス数：</label>
            <input type="number" id="height" value="20" min="1">
        </div>

        <button id="applySize">マス数を適用</button>

        <div class="buttons">
            <button id="start">スタート</button>
            <button id="stop">ストップ</button>
            <button id="step">1世代進む</button>
            <button id="rewind">巻き戻し</button>
            <button id="reset">リセット</button>
        </div>

        <div>
            <label for="speed">速度：</label>
            <input type="range" id="speed" min="1" max="20" value="5">
        </div>

    </div>

    <p>世代：<span id="generation">0</span></p>

    <div id="grid"></div>

    <script src="script.js"></script>

</body>
</html>
